server:
  port: 8070

spring:
  application:
    name: eureka-server
  config:
    import: "optional:configserver:http://localhost:8071/"
  security:
    user:
      name: admin
      password: admin123

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://admin:admin123@localhost:8070/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: false