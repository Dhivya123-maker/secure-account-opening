spring:
  application:
    name: eureka-server
  config:
    import: "optional:configserver:http://config-server:8071/"

server:
  port: 8070

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
