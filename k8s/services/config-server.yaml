apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: securebank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
      - name: config-server
        image: dhivyadev/securebank-pipeline-config-server:latest
        ports:
        - containerPort: 8071
        env:
        - name: JAVA_OPTS
          value: "-Xms64m -Xmx128m"
        resources:
          requests:
            memory: "150Mi"
            cpu: "50m"
          limits:
            memory: "250Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: securebank
spec:
  selector:
    app: config-server
  ports:
  - port: 8071
    targetPort: 8071
