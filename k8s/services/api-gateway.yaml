apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: securebank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: dhivyadev/securebank-pipeline-api-gateway:latest
        ports:
        - containerPort: 8085
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "400Mi"
            cpu: "300m"
        envFrom:
        - configMapRef:
            name: securebank-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: securebank
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8085
    targetPort: 8085
