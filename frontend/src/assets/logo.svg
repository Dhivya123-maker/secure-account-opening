<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="50" fill="#1a237e"/>
  
  <!-- Bank Building -->
  <rect x="20" y="48" width="60" height="32" fill="white"/>
  
  <!-- Roof -->
  <polygon points="15,48 50,22 85,48" fill="white"/>
  
  <!-- Door -->
  <rect x="40" y="62" width="20" height="18" fill="#1a237e"/>
  
  <!-- Windows -->
  <rect x="23" y="54" width="12" height="10" rx="1" fill="#3949ab"/>
  <rect x="65" y="54" width="12" height="10" rx="1" fill="#3949ab"/>
  
  <!-- Gold star on roof -->
  <circle cx="50" cy="38" r="6" fill="#ffd700"/>
  <text x="50" y="42" text-anchor="middle" font-size="8" fill="#1a237e">$</text>
</svg>