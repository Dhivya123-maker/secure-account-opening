version: '3.8'

services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: securebank-oracle
    environment:
      ORACLE_PWD: SecureBank#123
    ports:
      - "1522:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - securebank-network
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/SecureBank#123@//localhost:1521/FREE", "as", "sysdba", "@/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: securebank-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - securebank-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: securebank-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://securebank-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - securebank-network

  config-server:
    image: dhivyadev/securebank-pipeline-config-server:latest
    container_name: securebank-config-server
    build:
      context: .
      dockerfile: config-server/Dockerfile
    ports:
      - "8071:8071"
    networks:
      - securebank-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8071/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10

  eureka-server:
    image: dhivyadev/securebank-pipeline-eureka-server:latest
    container_name: securebank-eureka
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8070:8070"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - securebank-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8070/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10

  api-gateway:
    image: dhivyadev/securebank-pipeline-api-gateway:latest
    container_name: securebank-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - securebank-network

  auth-service:
    image: dhivyadev/securebank-pipeline-auth-service:latest
    container_name: securebank-auth
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - securebank-network

  customer-service:
    image: dhivyadev/securebank-pipeline-customer-service:latest
    container_name: securebank-customer
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - securebank-network

  account-service:
    image: dhivyadev/securebank-pipeline-account-service:latest
    container_name: securebank-account
    build:
      context: .
      dockerfile: account-service/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - securebank-network

  document-service:
    image: dhivyadev/securebank-pipeline-document-service:latest
    container_name: securebank-document
    build:
      context: .
      dockerfile: document-service/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - securebank-network

  notification-service:
    image: dhivyadev/securebank-pipeline-notification-service:latest
    container_name: securebank-notification
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - securebank-network

  frontend:
    image: dhivyadev/securebank-pipeline-frontend:latest
    container_name: securebank-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - securebank-network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: securebank-jenkins
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - securebank-network

  prometheus:
    image: prom/prometheus:latest
    container_name: securebank-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - securebank-network

  grafana:
    image: grafana/grafana:latest
    container_name: securebank-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - securebank-network

networks:
  securebank-network:
    driver: bridge

volumes:
  oracle-data:
  jenkins-data:
  document-storage:
  grafana_data:
